general {
    gaps_in = 6
    gaps_out = 8
    border_size = 3

    col.active_border = rgb(cba6f7) rgb(b4befe) 315deg
    col.inactive_border = rgb(11111b)
}

decoration {
    rounding = 20 #20

    blur {
        enabled = true
        size = 2 #8
        passes = 1
        new_optimizations = true
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 10
        render_power = 1
        color = rgba(0,0,0,0.4)
    }

    active_opacity = 1.0
    inactive_opacity = 0.95
    fullscreen_opacity = 1.0
}

bezier = overshoot, 0.05, 0.9, 0.1, 1.1
bezier = spring, 0.25, 1.25, 0.5, 1
bezier = smooth, 0.25, 0.1, 0.25, 1
bezier = snappy, 0.4, 0, 0.2, 1

animations {
    enabled = true
    animation = windows, 1, 4, spring, popin 80%
    # animation = border, 1, 10, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 2, default
    animation = specialWorkspace, 1, 4, spring, slidevert
	# animation = windowsMove, 1, 4, spring
	# animation = windowsMove, 1, 3, spring
	# animation = windowsMove, 1, 100, overshoot
}

dwindle {
    preserve_split = true
    smart_split = true
    smart_resizing = true
}

misc {
    disable_hyprland_logo = true
    mouse_move_enables_dpms = true
    disable_splash_rendering = true
    # animate_mouse_windowdragging = true
}

opengl {
    nvidia_anti_flicker = true
}

render {
    cm_sdr_eotf = 2
}
